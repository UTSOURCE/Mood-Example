name: 'runnable'
run-name: 'Runnable'

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

jobs:
  code-analysis:
    name: 'Code Analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Prepare dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Check Dart code formatting
        run: |
          dart format . -o none --set-exit-if-changed
      - name: Analyze Dart code
        run: |
          flutter analyze .

  integration-test-android:
    needs: [code-analysis]
    name: 'Integration Test :: ubuntu-latest :: Android'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Prepare dependencies
        run: |
          flutter --version
          flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: 'default'
          api-level: ${{ matrix.api-level }}
          arch: 'x86_64'
          emulator-port: 5554
          script: |
            ./gradlew connectedCheck
            flutter devices
            adb devices -l
      - name: Run Integration Test
        run: |
          flutter test integration_test/app_test.dart \
            --dart-define=test_mode=true \
            -d emulator-5554

  test-build-ios:
    needs: [integration-test-android]
    name: 'Test Build :: macos-latest :: iOS'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Prepare dependencies
        run: |
          dart --version
          flutter --version
          flutter pub get
      - name: Build
        run: flutter build ios --no-codesign

  test-build-android:
    needs: [integration-test-android]
    name: 'Test Build :: windows-latest :: Android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Prepare dependencies
        run: |
          dart --version
          flutter --version
          flutter pub get
      - name: Build
        run: flutter build apk --debug
        working-directory: ${{ github.workspace }}
